name: Deploy Laravel Pro To Linux

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml,zip, ctype, iconv, intl, pdo_mysql, bcmath, redis, opcache


      - name: Install Dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Verify PSR-4 autoload (Linux is case-sensitive)
        run: |
          php -r "require 'vendor/autoload.php'; if (! class_exists('Database\\Seeders\\Support\\ProjectPageCopy')) { fwrite(STDERR, 'ProjectPageCopy autoload failed — check database/seeders/Support/ folder casing'.PHP_EOL); exit(1); }"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

      - name: Verify and package frontend build
        run: |
          test -f public/build/manifest.json
          test -d public/build/assets
          php -r '$manifest = json_decode(file_get_contents("public/build/manifest.json"), true, 512, JSON_THROW_ON_ERROR); $files = []; foreach ($manifest as $entry) { $files[] = $entry["file"] ?? null; foreach ($entry["css"] ?? [] as $file) { $files[] = $file; } } $missing = array_filter($files, fn ($file) => ! is_string($file) || ! is_file("public/build/".$file)); if ($missing !== []) { fwrite(STDERR, "Missing Vite assets: ".implode(", ", $missing).PHP_EOL); exit(1); }'
          tar -C public/build -czf vite-build.tar.gz .


      - name: Copy files to server (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "."
          target: "/home2/${{ secrets.SSH_USER }}/releases/${{ github.sha }}"
          strip_components: 0
          # overwrite: true   # اختياري

      - name: Deploy & Run Commands on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            APP_DIR="/home2/${{ secrets.SSH_USER }}"
            RELEASE_DIR="$APP_DIR/releases"
            NEW_RELEASE_DIR="$RELEASE_DIR/${{ github.sha }}"
            SHARED_DIR="$APP_DIR/shared"

            echo "🚀 Deploying release: ${{ github.sha }}"

            # إنشاء المجلدات المشتركة
            mkdir -p "$SHARED_DIR"
            mkdir -p "$SHARED_DIR/storage" "$RELEASE_DIR"
            rsync -avzh "$NEW_RELEASE_DIR/storage" "$SHARED_DIR"


            cd "$NEW_RELEASE_DIR"

            # Always restore the exact Vite build produced by CI. The build
            # directory is intentionally gitignored, so it must be treated as
            # a deployment artifact rather than a repository file.
            test -f "$NEW_RELEASE_DIR/vite-build.tar.gz"
            rm -rf "$NEW_RELEASE_DIR/public/build"
            mkdir -p "$NEW_RELEASE_DIR/public/build"
            tar -xzf "$NEW_RELEASE_DIR/vite-build.tar.gz" -C "$NEW_RELEASE_DIR/public/build"
            rm -f "$NEW_RELEASE_DIR/vite-build.tar.gz"

            test -f "$NEW_RELEASE_DIR/public/build/manifest.json"
            /usr/local/bin/ea-php84 -r '$manifest = json_decode(file_get_contents("public/build/manifest.json"), true, 512, JSON_THROW_ON_ERROR); $files = []; foreach ($manifest as $entry) { $files[] = $entry["file"] ?? null; foreach ($entry["css"] ?? [] as $file) { $files[] = $file; } } $missing = array_filter($files, fn ($file) => ! is_string($file) || ! is_file("public/build/".$file)); if ($missing !== []) { fwrite(STDERR, "Missing Vite assets: ".implode(", ", $missing).PHP_EOL); exit(1); }'

            # ربط الملفات المشتركة
            rm -rf storage public/storage
            ln -nfs "$SHARED_DIR/storage" storage
            /usr/local/bin/ea-php84 artisan storage:link

            # .env
            rm -rf .env
            ln -nfs "$SHARED_DIR/.env" .env

            #.htacces
            rm -rf .htaccess
            ln -nfs "$SHARED_DIR/.htaccess" .htaccess

            # تبديل الـ current symlink
            if [ -d "$APP_DIR/current" ]; then
              unlink "$APP_DIR/current" || true
            fi
            ln -nfs "$NEW_RELEASE_DIR" "$APP_DIR/current"

            # ربط public_html
            if [ -d "$APP_DIR/public_html" ]; then
              unlink "$APP_DIR/public_html" || true
            fi
            ln -nfs "$APP_DIR/current/public" "$APP_DIR/public_html"

            if command -v composer >/dev/null 2>&1; then
              composer dump-autoload -o --no-dev
            fi

            /usr/local/bin/ea-php84 artisan migrate --force
            /usr/local/bin/ea-php84 artisan optimize:clear

            #/usr/local/bin/ea-php84 artisan jwt:secret
            #/usr/local/bin/ea-php84 artisan l5-swagger:generate --all
            
            #for restart php-fpm
            touch "$APP_DIR"/.restart_php_fpm
            
            # حذف الإصدارات القديمة (احتفظ بآخر 5)
            cd "$RELEASE_DIR" && ls -t | tail -n +6 | xargs rm -rf || true

            echo "✅ Deployment Completed Successfully - ${{ github.sha }}"
